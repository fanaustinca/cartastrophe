<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Cartastrophe</title>
  <meta name="description" content="8-player shopping-cart racing through destructible parody grocery stores." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading" class="screen show"><div class="spinner"></div><div id="loading-text">Stocking shelves…</div></div>

  <div id="title" class="screen">
    <div class="logo">CART<span>ASTROPHE</span></div>
    <div class="tag">Grocery runs. Zero survivors.</div>
    <div class="menu">
      <button id="btn-quick" class="big">🛒 Quick Race <small>vs 7 bots</small></button>
      <button id="btn-host">📡 Host Online Lobby</button>
      <div class="row"><input id="join-code" maxlength="5" placeholder="CODE" autocomplete="off" /><button id="btn-join">Join</button></div>
      <button id="btn-garage">🔧 Garage &amp; Shop</button>
      <button id="btn-settings">⚙ Settings</button>
    </div>
    <div id="store-pick" class="stores"></div>
    <div class="wallet">🎟 <b id="coupons">0</b> coupons</div>
    <div id="title-err" class="err"></div>
    <div class="help">WASD / arrows drive · Shift sprint · Space hop on &amp; ride (drift) · C camera · R reset · Esc pause</div>
  </div>

  <div id="lobby" class="screen">
    <h2>Lobby <span id="lobby-code" class="code"></span> <button id="btn-copy" class="small">Copy invite link</button></h2>
    <div id="lobby-status" class="sub"></div>
    <div id="lobby-players" class="slots"></div>
    <div id="lobby-stores" class="stores"></div>
    <div class="menu row">
      <button id="btn-start" class="big">Start Race</button>
      <button id="btn-leave">Leave</button>
    </div>
  </div>

  <div id="garage" class="screen">
    <h2>Garage <span class="wallet">🎟 <b id="g-coupons">0</b></span></h2>
    <div id="g-tabs" class="tabs"></div>
    <div id="g-items" class="shop"></div>
    <div class="menu row"><button id="btn-garage-back">Back</button></div>
  </div>

  <div id="settings" class="screen">
    <h2>Settings</h2>
    <label>Name <input id="s-name" maxlength="16" /></label>
    <label>Graphics <select id="s-quality"><option value="low">Low (fastest)</option><option value="medium">Medium</option><option value="high">High</option></select></label>
    <label>Volume <input id="s-volume" type="range" min="0" max="1" step="0.05" /></label>
    <div class="menu row"><button id="btn-settings-back">Back</button></div>
  </div>

  <div id="hud" class="hidden">
    <div id="h-timer">3:00</div>
    <div id="h-store"></div>
    <div id="h-list"></div>
    <div id="h-standings"></div>
    <div id="h-msgs"></div>
    <div id="h-count"></div>
    <div id="h-bottom">
      <div id="h-speed"><b>0</b> km/h</div>
      <div class="bar"><div id="h-stamina"></div></div>
      <div id="h-surface"></div>
    </div>
    <canvas id="h-map" width="220" height="180"></canvas>
    <div id="h-fps"></div>
  </div>

  <div id="pause" class="screen">
    <h2>Paused</h2>
    <div class="menu"><button id="btn-resume" class="big">Resume</button><button id="btn-quit">Quit to Menu</button></div>
  </div>

  <div id="results" class="screen">
    <h2 id="r-title">Results</h2>
    <table id="r-table"></table>
    <div id="r-reward" class="sub"></div>
    <div class="menu row"><button id="btn-again" class="big">Race Again</button><button id="btn-menu">Menu</button></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
